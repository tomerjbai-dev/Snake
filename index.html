<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake DeBest</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M14 46h20V32H22V18h22' fill='none' stroke='%2300e5ff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='18' r='6.5' fill='%2339ff88'/%3E%3Ccircle cx='46' cy='16' r='1.6' fill='%2305070d'/%3E%3Ccircle cx='46' cy='44' r='5' fill='%23ff2e88'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <h1 class="logo">SNAKE ShelHa DeBest</h1>
      <div class="score">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
    </header>

    <section class="board" id="board">
      <canvas id="canvas" aria-label="Snake game board"></canvas>

      <div class="overlay" id="overlay">
        <h2 class="overlay-title" id="overlay-title">Ready?</h2>
        <p class="overlay-text" id="overlay-text">Eat, grow, and don't hit the walls.</p>
        <button class="start-button" id="start-button" type="button">Start</button>
      </div>
    </section>

    <footer class="hint">Arrow keys / WASD &middot; Swipe on touch screens</footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
